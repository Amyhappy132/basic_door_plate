[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600


build_flags = 
    -DCONFIG_BTDM_CTRL_MODEM_SLEEP=y
    -DCONFIG_FREERTOS_USE_TICKLESS_IDLE=y
    -DCONFIG_FREERTOS_IDLE_TIME_BEFORE_SLEEP=5

lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0